<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ivdr-wiki 다음 작업</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
body{margin:0;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f8fafc}
#bar{position:fixed;top:0;left:0;right:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 16px;display:flex;gap:12px;align-items:center;z-index:10}
#bar h1{font-size:15px;margin:0;color:#0f172a;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#q{padding:6px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;width:180px}
svg{width:100vw;height:100vh;cursor:grab;background:#f8fafc}
.node circle{stroke-width:2.5px;fill:#fff}
.node text{font-size:13px;font-weight:600;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}
.node.collapsed circle{fill:currentColor}
.link{fill:none;stroke-opacity:.55;stroke-width:2px}
.hit{font-weight:800;text-decoration:underline}
#tip{position:fixed;background:#0f172a;color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;max-width:260px;display:none;z-index:20;pointer-events:none}
</style></head><body>
<div id="bar"><h1>ivdr-wiki 다음 작업</h1><input id="q" placeholder="검색…"></div>
<div id="tip"></div><svg></svg>
<script>
const data={"title": "ivdr-wiki 다음 작업", "children": [{"title": "제품 기능 확장", "children": [{"title": "01 추적성 2단계", "note": "추적성 매트릭스(REQ↔RSK↔VFY↔EVD)에 설계 출력과 변경 영향, 리비전·감사 기록을 더한다. — 시작 조건: 바로 가능", "children": [{"title": "설계 출력 개체(BOM·PCB·SW)"}, {"title": "변경 영향 후보·판정"}, {"title": "리비전·변경 사유 기록"}, {"title": "의심 링크"}, {"title": "⏱ 바로 가능", "note": "없음(브라우저 저장으로 시작)"}]}, {"title": "05 문서 생성기 강화", "note": "추적성·위험관리 데이터로 제출용 형식의 문서를 더 만든다. — 시작 조건: 바로 가능", "children": [{"title": "매트릭스·RMR 문서"}, {"title": "회사 템플릿 분리"}, {"title": "Excel·Word 가져오기"}, {"title": "⏱ 바로 가능", "note": "없음"}]}, {"title": "08 MDR 확장 (비IVD)", "note": "체외진단이 아닌 의료기기(EU MDR)까지 판정 범위를 넓힌다. — 시작 조건: 설계부터", "children": [{"title": "규칙 데이터 설계"}, {"title": "SaMD Rule 11"}, {"title": "MDR 문서 세트"}, {"title": "⏱ 설계부터", "note": "02와 같은 원문 확인 네트워크 권장"}]}, {"title": "09 화면 품질", "note": "다크 모드·접근성·첫 로딩 크기를 정리한다. — 시작 조건: 바로 가능", "children": [{"title": "다크 모드"}, {"title": "접근성 점검"}, {"title": "번들 줄이기"}, {"title": "⏱ 바로 가능", "note": "없음"}]}]}, {"title": "규제 정확도·검증", "children": [{"title": "02 규정 원문 대조", "note": "2차 자료로 넣은 규칙을 원문과 대조해 '원문 확인 필요' 표시를 줄인다. — 시작 조건: 네트워크 허용 필요", "children": [{"title": "IVDR Rule 4(a)·MDCG 2020-16"}, {"title": "국내 자가검사 허용 품목"}, {"title": "21 CFR 862.9·862.1300"}, {"title": "ISO 15223-1 심볼"}, {"title": "⏱ 네트워크 허용 필요", "note": "세션 네트워크에 eur-lex.europa.eu, health.ec.europa.eu, law.go.kr, mfds.go.kr, ecfr.gov, accessdata.fda.gov 허용"}]}, {"title": "07 검증 3차", "note": "가상 심사관 패널 3차·사용성 3차 점검과 RA 전문가 검토 준비 자료를 만든다. — 시작 조건: 바로 가능", "children": [{"title": "패널 3차·FSH 시나리오"}, {"title": "사용성 3차"}, {"title": "RA 검토 요청서"}, {"title": "⏱ 바로 가능", "note": "없음"}]}]}, {"title": "플랫폼 (서버)", "children": [{"title": "03 AI 서버 (Vercel)", "note": "server/를 Vercel에 배포하고 요구사항 리뷰·문장 다듬기·번역을 붙인다. — 시작 조건: 사용자 설정 필요", "children": [{"title": "Vercel 배포·보안"}, {"title": "요구사항 리뷰"}, {"title": "문장 다듬기·수치 플래그"}, {"title": "번역"}, {"title": "⏱ 사용자 설정 필요", "note": "사용자가 Vercel 프로젝트와 ANTHROPIC_API_KEY·접근 코드를 직접 설정 / Anthropic 콘솔 지출 한도 설정"}]}, {"title": "04 서버 저장·다중 사용자", "note": "브라우저 저장을 넘어 팀이 같은 프로젝트를 쓰게 한다. — 시작 조건: 03 이후", "children": [{"title": "로그인·회사 분리"}, {"title": "역할·권한(외주 포함)"}, {"title": "감사 기록·승인"}, {"title": "브라우저 데이터 이전"}, {"title": "⏱ 03 이후", "note": "03 완료(서버 기반) / DB·인증 서비스 선택 — 사용자 결정"}]}]}, {"title": "사례·사업", "children": [{"title": "06 사례 적용: 갱년기 FSH", "note": "'내 소변으로 갱년기 관리 시작' 컨셉을 실제로 끝까지 밀어 보며 앱의 빈 곳을 찾는다. — 시작 조건: 바로 가능", "children": [{"title": "스펙 완성·시장값 입력"}, {"title": "IFU 표현 점검"}, {"title": "규제 확인 목록"}, {"title": "앱 개선점 목록"}, {"title": "⏱ 바로 가능", "note": "사용자가 회사 정보·목표값을 알려 줘야 함(없으면 빈칸)"}]}, {"title": "10 통합 PRD·사업화", "note": "DesignFlow MD PRD와 ivdr-wiki를 합친 통합 PRD와 PoC 서비스 패키지를 만든다. — 시작 조건: 바로 가능", "children": [{"title": "통합 PRD"}, {"title": "PoC 서비스 패키지"}, {"title": "KPI 측정 설계"}, {"title": "⏱ 바로 가능", "note": "사용자 사업 방향 결정"}]}]}]},PAL=["#2563eb", "#059669", "#d97706", "#dc2626", "#7c3aed", "#0891b2", "#db2777"];
const svg=d3.select("svg"),g=svg.append("g");
const gLink=g.append("g").attr("class","links"),gNode=g.append("g").attr("class","nodes");
svg.call(d3.zoom().scaleExtent([0.2,3]).on("zoom",e=>g.attr("transform",e.transform)));
const root=d3.hierarchy(data);
root.descendants().forEach((d,i)=>{d.id=i;d._children=d.children;if(d.depth>1)d.children=null;});
root.x0=innerHeight/2;root.y0=100;
function color(d){let a=d;while(a.depth>1)a=a.parent;return d.depth===0?"#0f172a":PAL[(a.parent?a.parent.children.indexOf(a):0)%PAL.length];}
const tree=d3.tree().nodeSize([30,220]);
function px(d){return d.y+120}
function py(d){return d.x+innerHeight/2}
function elbow(d){
 const sx=px(d.source),sy=py(d.source),tx=px(d.target),ty=py(d.target),mx=(sx+tx)/2;
 return `M${sx},${sy}H${mx}V${ty}H${tx}`;
}
const tip=document.getElementById("tip");
function update(src){
 tree(root);
 const nodes=root.descendants(),links=root.links();
 const node=gNode.selectAll("g.node").data(nodes,d=>d.id);
 const ne=node.enter().append("g").attr("class","node")
  .attr("transform",`translate(${src.y0},${src.x0})`)
  .on("click",(e,d)=>{if(d.children){d.children=null}else{d.children=d._children}update(d);})
  .on("mousemove",(e,d)=>{if(d.data.note){tip.style.display="block";tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";tip.textContent=d.data.note;}})
  .on("mouseleave",()=>tip.style.display="none");
 ne.append("circle").attr("r",6);
 ne.append("text").attr("dy","0.32em").attr("x",10).text(d=>d.data.title);
 const all=ne.merge(node);
 all.transition().duration(300).attr("transform",d=>`translate(${d.y+120},${d.x+innerHeight/2})`);
 all.attr("class",d=>"node"+(d._children&&!d.children?" collapsed":""))
    .style("color",color).select("circle").attr("stroke",color);
 all.select("text").attr("fill",d=>d.depth===0?"#0f172a":"#334155");
 node.exit().transition().duration(300).attr("transform",`translate(${src.y+120},${src.x+innerHeight/2})`).remove();
 gLink.selectAll("path.link").data(links,d=>d.target.id)
  .join(
    enter=>enter.append("path").attr("class","link")
      .attr("d",elbow({source:{x:src.x0,y:src.y0},target:{x:src.x0,y:src.y0}}))
      .call(e=>e.transition().duration(300).attr("stroke",d=>color(d.target)).attr("d",elbow)),
    update=>update.transition().duration(300).attr("stroke",d=>color(d.target)).attr("d",elbow),
    exit=>exit.transition().duration(300)
      .attr("d",elbow({source:{x:src.x,y:src.y},target:{x:src.x,y:src.y}}))
      .remove()
  );
 nodes.forEach(d=>{d.x0=d.x;d.y0=d.y;});
}
document.getElementById("q").addEventListener("input",e=>{
 const q=e.target.value.trim().toLowerCase();
 if(q){root.descendants().forEach(d=>{if((d.data.title||"").toLowerCase().includes(q)){let a=d.parent;while(a){a.children=a._children;a=a.parent;}}});}
 update(root);
 gNode.selectAll("g.node text").classed("hit",d=>q&&(d.data.title||"").toLowerCase().includes(q));
});
update(root);
</script></body></html>
